<!doctype html><meta charset=utf8><style>
body{margin:0;background:#0d0f11;color:#e8eaed;font:13px -apple-system,Arial,sans-serif;padding:40px;}
:root{--muted:#9aa0a6;--accent:#4c9be8;--border:#2a2d31;}
.card{max-width:460px;margin:0 auto 24px;background:#16181b;border:1px solid #2a2d31;border-radius:12px;padding:18px;}
.pcard-src{font-size:9.5px;color:var(--muted);text-align:center;padding:10px 0 2px;}
/* ── Target map (Routes tab · per-target view) ── */
.tm-view{display:inline-flex;gap:4px;margin-right:8px;padding-right:8px;border-right:1px solid var(--border);}
.tm-view .rt-metric-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tm-legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:8px 2px 0;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
.tm-legend span{display:inline-flex;align-items:center;gap:6px;}
.tm-legend i{display:inline-block;width:12px;height:12px;border-radius:50%;box-sizing:border-box;}
.tm-l-inc{border:2.5px solid #9aa0a6;background:#101214;}
.tm-l-catch{background:#fff;border:1px solid #101214;}
.tm-l-yac{width:22px!important;height:5px!important;border-radius:3px!important;background:#39c15a;}
.tm-l-td{border:3px solid #2f6fe4;background:#39c15a;}
.tm-l-int{border:2.5px solid #d33b2f;background:#101214;}
.tm-l-los{width:22px!important;height:4px!important;border-radius:2px!important;background:#2f6fe4;}
.ngs-links{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;vertical-align:middle;margin-left:8px;}
.ngs-words{display:inline-flex;align-items:center;gap:14px;}
.ngs-shield{height:18px;width:auto;display:block;flex:none;}
.ngs-word{height:18px;width:auto;display:block;}
.ngs-word-link{display:inline-flex;text-decoration:none;line-height:0;}
.ngs-word-link:hover .ngs-word{opacity:.75;}
.tm-l-route{width:22px!important;height:3px!important;border-radius:2px!important;background:#fff;}
/* The view toggle owns a row of its own, so Map ↔ Zones ↔ Tree never moves it; the
   metric buttons of the zone chart / route tree take the row beneath (absent on the map). */
.rt-viewrow{margin-top:-2px;}
.rt-viewrow .tm-view{border-right:0;margin-right:0;padding-right:0;}
.rt-metricrow{margin-top:-2px;}
/* carry map swatches */
.tm-l-loss{width:22px!important;height:4px!important;border-radius:2px!important;background:#d33b2f;}
.tm-l-short{width:22px!important;height:4px!important;border-radius:2px!important;background:#d8a51d;}
.tm-l-gain{width:22px!important;height:4px!important;border-radius:2px!important;background:#39c15a;}
.tm-l-fd{background:#fff;width:8px!important;height:8px!important;margin:0 2px;}
.tm-l-fum{border:3px solid #d33b2f;background:transparent;}
.tm-l-arc{width:22px!important;height:4px!important;border-radius:2px!important;background:#2f6fe4;}

.light{background:#f4f5f7;padding:24px;border-radius:12px;} .light .card{background:#fff;border-color:#dcdfe3;color:#111;margin-bottom:0;} .light .pcard-src{color:#6b7075;}
.big{transform:scale(2.4);transform-origin:left center;display:inline-block;margin:30px 0 30px 40px;}
</style>

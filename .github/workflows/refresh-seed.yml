name: Refresh seed data

# Keeps seeds/ current without anyone running build_seed.py by hand.
#
# The schedule is intentionally boring — wake-ups that usually do almost nothing.
# tools/seed_refresh.py decides what is actually stale (Sleeper daily, FantasyPros weekly,
# contracts fortnightly, nflverse and the in-season sidecar only when an upstream release
# timestamp changes) and refreshes just those. Most runs re-fetch one source or none — and
# in season most runs stop at the probe step without installing anything.
#
# SAFETY, which is the whole point:
#   • Several build steps degrade to an EMPTY result when a scrape is blocked — build_ecr()
#     returns {} if FantasyPros refuses. A human sees the warning; a cron job does not. So the
#     refresher compares the rebuilt seed against the committed one and aborts on data loss.
#   • Nothing is committed unless the seed actually changed AND the app's test suite passes
#     against it.
#   • Spotrac is never fetched here: it answers 403 to datacenter IPs, and a failed fetch would
#     empty the offseason roster-change block. It stays a run-it-from-a-laptop source.
#
# DEPLOYING: pages.yml triggers on push to main, but NOT on this workflow's push — commits
# made with the default GITHUB_TOKEN never fire other workflows' `on: push` (GitHub's
# recursion guard). workflow_dispatch is exempt from that guard, so after a successful
# commit this workflow dispatches pages.yml explicitly.

on:
  schedule:
    # Odd off-peak minutes: GitHub delays on-the-hour crons by hours under load
    # (the old 09:00 slot fired ~13:25).
    #   • Two daily slots, year round: the general sources (Sleeper, FantasyPros,
    #     contracts, …) and the Monday market-model refit (13:17 slot only).
    #   • In season (Sep–Feb), a LOOK every two hours. nflverse posts a game's
    #     play-by-play at an irregular hour the morning after — its workflow fires
    #     at 05:33 UTC after TNF/SNF/MNF, 09:03 daily, 22:03 and 00:07 UTC around
    #     the Sunday windows, each pushed later by GitHub's own queue — so no fixed
    #     slot can chase it. A look is cheap: the probe step below reads the release
    #     timestamps (stdlib only, no cache, no pandas) and the heavy steps run only
    #     when something the sidecar reads has actually moved.
    - cron: '37 6 * * *'             # ~06:37 UTC nominal
    - cron: '17 13 * * *'            # ~13:17 UTC — also the Monday market-model slot
    - cron: '41 */2 * 1,2,9-12 *'    # in-season: look every two hours
  workflow_dispatch:
    inputs:
      force:
        description: 'Sources to refresh regardless of schedule (comma-separated, e.g. ecr,ktc)'
        required: false
        default: ''
      dry_run:
        description: 'Report what would change and stop'
        type: boolean
        required: false
        default: false

# Never let two refreshes race for the same commit.
concurrency:
  group: refresh-seed
  cancel-in-progress: false

permissions:
  contents: write
  actions: write        # to dispatch pages.yml after a seed commit

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Look before you lift ────────────────────────────────────────────────
      # The weekly market-model refit is pinned to ONE slot (Monday 13:17 UTC) so
      # the two-hourly in-season looks do not each re-crawl ~1.5k draft pages.
      - name: Is the weekly market-model refit due?
        id: mm
        run: |
          if { [ "$(date -u +%u)" = "1" ] && [ "${{ github.event.schedule }}" = "17 13 * * *" ]; } \
             || [ "${{ github.event.inputs.force }}" = "market_model" ]; then
            echo "due=true"  >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      # The probe is tools/seed_refresh.py --check: it reads every upstream stamp,
      # prints the nflverse pulse (which games the live sidecar holds vs. what
      # nflverse has published since — also written to this run's summary), and
      # says what is stale. Nothing stale and no refit due → the run ends here, in
      # under a minute, with no cache restore and no pip install.
      - name: Probe upstream
        id: probe
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.force }}" ]; then
            ARGS="--force ${{ github.event.inputs.force }}"
          fi
          python3 tools/seed_refresh.py --check $ARGS 2>&1 | tee probe.log
          if grep -q '^Nothing is stale' probe.log && [ "${{ steps.mm.outputs.due }}" != "true" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "nothing moved upstream — stopping before the heavy steps"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # nflverse metrics need pandas/pyarrow; the OL grades pipeline additionally needs
      # scipy (sparse matrices + nnls) AND scikit-learn (LogisticRegression). Without either
      # one the pipeline is skipped "additively", the nflverse block halves, and the
      # refresher's 80% guard rejects the whole build.
      - name: Install build dependencies
        if: steps.probe.outputs.stale == 'true'
        run: pip install --quiet 'pandas>=2.2' 'pyarrow>=16.0' 'scipy>=1.11' 'scikit-learn>=1.3'

      # The scrape cache is what makes selective refresh possible: a cache MISS is what tells
      # build_seed.py to re-fetch a source. Restoring it means we only pay for what is stale.
      #
      # SPLIT IN TWO, deliberately. cache/cfb holds cfbfastR play-by-play parquets and is ~1 GB
      # — roughly 20x everything else combined. Rolling that into the daily key would move a
      # gigabyte on every run to pick up a source that changes once a year. So:
      #
      #   • cache/cfb      stable key, effectively write-once. actions/cache only uploads when
      #                    the key is absent, so this costs one upload ever and a restore only
      #                    when a run actually needs it.
      #   • everything else  rotating key, saved fresh each run, restore-keys fall back to the
      #                    most recent.
      #
      # A cold cache is slow but never wrong — build_seed.py simply re-fetches what is missing.
      - name: Restore college parquet cache
        if: steps.probe.outputs.stale == 'true'
        uses: actions/cache@v4
        with:
          path: cache/cfb
          # Deliberately OUTSIDE the `seed-cache-` prefix: the scrape cache below restores by
          # that prefix, and the cfb tarball (saved last, so newest) used to match it — leaving
          # every fetcher with a cold cache on run 2.
          key: cfb-parquet-v1

      - name: Restore scrape cache
        if: steps.probe.outputs.stale == 'true'
        uses: actions/cache@v4
        with:
          path: |
            cache
            !cache/cfb
          key: seed-cache-${{ github.run_id }}
          restore-keys: |
            seed-cache-

      # ── Market-model self-training ──────────────────────────────────────────
      # Once a week, re-crawl real completed drafts of the current season and
      # re-fit the advisory's survival calibration (eps/tau) from them, so the
      # model tracks THIS year's rooms instead of the year it was hand-fitted.
      # The blob is committed (seeds/market_model.json) and baked into the seed
      # by build_seed.py; consumers bound-check it, and the fitter refuses to
      # emit anything from a thin corpus — so the worst case is "keep last week's".
      # Weekly, not daily: parameters move slowly and the crawl is ~1.5k polite
      # requests cold (cheap warm — cache/corpus rides the scrape cache below).
      - name: Refresh market model (Monday 13:17 slot)
        if: steps.mm.outputs.due == 'true'
        run: python3 tools/draft_corpus.py refresh --out seeds/market_model.json 2>&1 | tail -5

      - name: Decide and refresh
        id: refresh
        if: steps.probe.outputs.stale == 'true'
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.force }}" ]; then
            ARGS="$ARGS --force ${{ github.event.inputs.force }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 tools/seed_refresh.py $ARGS 2>&1 | tee refresh.log

      # Rebuild the .gz files the app actually downloads. build_seed.py writes the plain JSON;
      # pages.yml publishes seeds/*.json.gz, so a refreshed seed that skipped this step would
      # deploy yesterday's data.
      - name: Recompress seed artifacts
        if: steps.probe.outputs.stale == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in seeds/*.json; do
            case "$f" in
              seeds/refresh-state.json|seeds/roster_moves_baseline.json) continue ;;   # bookkeeping, not app data
            esac
            # -n: no mtime/filename in the gzip header, so an unchanged seed produces identical
            # bytes and the "nothing changed" path below can actually fire. Without it every
            # run re-wrote ~5 MB of .gz, committed, and deployed — daily, with no data change.
            gzip -9 -n -c "$f" > "$f.gz"
          done
          ls -la seeds/ | head -20

      # A refreshed seed changes what the app loads, so the app's own suite runs against it.
      # This catches a structurally valid seed that the app cannot actually read — a shape
      # change upstream, a codec mismatch — which the refresher's count guards would miss.
      - name: Rebuild app and run tests
        if: steps.probe.outputs.stale == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          python3 build.py
          # The whole run goes to a file; the log shows the summary, and on red the failing
          # suites' own lines — a bare "1 FAILED" in the tail names nothing.
          if ./tests/run_tests.sh index.html > suite.out 2>&1; then
            tail -25 suite.out
          else
            tail -25 suite.out
            echo "::group::failing suites"
            grep -nE "✗|FAIL|crashed" tests/last_run.log | grep -v "✓" | head -80 || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Keep the full test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: tests/last_run.log
          retention-days: 7

      - name: Commit if anything changed
        id: commit
        if: steps.probe.outputs.stale == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  'triplecrown-bot'
          git config user.email 'triplecrown-bot@users.noreply.github.com'
          git add -A seeds/ archives/
          # A code merge can land on main while the seed bakes (~15 min); the seed commit
          # touches only seeds/ + archives/, so rebase onto it and push again.
          _push(){ for i in 1 2 3; do git push && return 0; git pull --rebase origin main || return 1; done; return 1; }
          if git diff --cached --quiet; then
            echo "No seed changes — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "data=false"   >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Bookkeeping vs data: refresh-state.json is the scheduler's anchor, not app data.
          # It still gets committed (so cadences don't re-anchor every run), but a commit that
          # touches ONLY it must not trigger a Pages deploy — nothing the app loads changed.
          DATA=$(git diff --cached --name-only | grep -v '^seeds/refresh-state.json$' || true)
          if [ -z "$DATA" ]; then
            git commit -m "chore(seed): refresh bookkeeping (no data change)" \
                       -m "Only seeds/refresh-state.json moved — schedule anchors and upstream stamps. Not deploying."
            _push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "data=false"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUMMARY=$(grep -E '^Refreshed:' refresh.log || echo 'Refreshed: seed data')
          git commit -m "chore(seed): ${SUMMARY#Refreshed: }" \
                     -m "Automated refresh via tools/seed_refresh.py." \
                     -m "$(grep -E '^\s+\[(REFRESH|  skip )\]' refresh.log || true)"
          _push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "data=true"   >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not fire pages.yml's `on: push`, so kick the
      # deploy explicitly. workflow_dispatch is exempt from the recursion guard.
      - name: Trigger Pages deploy
        if: github.event.inputs.dry_run != 'true' && steps.commit.outputs.data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      # A rejected build is the interesting failure: it means a source is blocked or has
      # changed shape. Keep the log so it can be read after the fact.
      - name: Upload refresh log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log
          path: |
            probe.log
            refresh.log
          retention-days: 14
          if-no-files-found: ignore

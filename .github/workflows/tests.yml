# The gate, as CI — the same full suite every local gated push runs, plus one check the
# local gate never had: the committed index.html must match a fresh build from src/
# (catches "edited src, forgot to rebuild" and hand-edits to the built file).
#
# Runs on every pull request (the tools/gate.sh --ci path opens PRs with auto-merge, so
# green here IS the merge decision) and on demand. Direct pushes to main stay possible
# for the seed cron, which runs this same suite inside its own workflow.
name: Tests
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install --quiet 'pandas>=2.2' 'pyarrow>=16.0' 'scipy>=1.11' 'scikit-learn>=1.3'

      - name: Build drift check
        run: |
          python3 build.py
          node tests/extract_app.js index.html
          # A dirty diff here means the branch's committed build doesn't match its sources.
          git diff --stat --exit-code index.html tests/check.js \
            || { echo "::error::committed index.html/check.js don't match a fresh build — run python3 build.py && node tests/extract_app.js index.html and commit"; exit 1; }

      - name: Run the full suite
        run: |
          if ./tests/run_tests.sh index.html > suite.out 2>&1; then
            tail -5 suite.out
          else
            tail -5 suite.out
            echo "::group::failing suites"
            grep -nE "✗|FAIL|crashed" tests/last_run.log | grep -v "✓" | head -80 || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Keep the full test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log
          path: tests/last_run.log
          retention-days: 7

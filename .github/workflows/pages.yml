name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build app
        run: python3 build.py

      - name: Prepare minimal Pages artifact
        run: |
          set -o pipefail
          rm -rf _site
          mkdir -p _site/seeds _site/images
          cp index.html _site/index.html
          # Only the images the APP actually references. The rest of images/ is README
          # screenshots (~2MB), which GitHub renders from the repo, not from Pages.
          cp images/app-icon.png images/ktc.png _site/images/
          cp seeds/*.json.gz _site/seeds/
          cp manifest.webmanifest _site/manifest.webmanifest
          # Stamp the service worker's cache name with this commit so a deploy retires the old
          # cache instead of serving yesterday's index.html forever.
          sed "s/__BUILD_ID__/${GITHUB_SHA::12}/" sw.js > _site/sw.js
          touch _site/.nojekyll
          du -sh _site

      # Minify only the DEPLOYED copy. src/ and the committed index.html stay readable, so
      # `python build.py --check` keeps verifying source parity; this just shrinks what the
      # browser has to download, parse and compile. Never fails the deploy — see the script.
      - name: Minify for delivery
        run: |
          set -o pipefail
          python3 tools/minify_site.py _site/index.html
          du -sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 10
          reporting_interval: 5000
